name: test
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  database:
    runs-on: ubuntu-24.04 # ships PostgreSQL 16 server binaries
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/db/run.sh
